<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>ФотоМаг</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>ФотоМаг</h1>
        <button id="cart-btn" onclick="openCart()">Корзина (0)</button>
    </header>
    <main>
        <section id="catalog" class="catalog"></section>
    </main>

    <div id="cart-modal">
        <div id="modal-container">
            <div id="cart-content">
                <h2>Ваша корзина</h2>
                <div id="cart-items"></div>
                <h3>Итого: <span id="total-price">0</span> руб.</h3>
                <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
                <button class="btn btn-primary" onclick="showOrderForm()">Оформить заказ</button>
            </div>
            <div id="order-form" style="display:none;">
                <h2>Доставка</h2>
                <input type="text" id="name" placeholder="Имя">
                <input type="text" id="surname" placeholder="Фамилия">
                <input type="text" id="address" placeholder="Адрес доставки" style="width: 100%;">
                <input type="tel" id="phone" placeholder="Телефон">
                <button class="btn btn-primary" onclick="createOrder()">Создать заказ</button>
                <button class="btn btn-secondary" onclick="backToCart()">Назад</button>
            </div>
        </div>
    </div>
    <div id="notification"></div>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
